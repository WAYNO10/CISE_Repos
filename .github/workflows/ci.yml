name: Node CI

on:
  push:
    branches: [ main, Development ]
  pull_request:
    branches: [ main, Development ]

jobs:
  react-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worksheet2/my-react-app   # 关键：在子项目目录执行
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false